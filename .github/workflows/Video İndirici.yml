name: APK Derle

on:
  workflow_dispatch:        # Actions sekmesinden elle de tetiklenebilir
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: buildozer.spec'in bulunduğu klasörü belirle
        id: konum
        run: |
          DOSYA=$(find . -name buildozer.spec -not -path './.git/*' | head -n1)
          if [ -z "$DOSYA" ]; then
            echo "HATA: buildozer.spec repo içinde hiçbir yerde bulunamadı." >&2
            exit 1
          fi
          echo "Bulundu: $DOSYA"
          echo "dir=$(dirname "$DOSYA")" >> "$GITHUB_OUTPUT"

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential libltdl-dev

      - name: Buildozer ve Cython kur
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: APK derle
        working-directory: ${{ steps.konum.outputs.dir }}
        run: |
          yes | buildozer -v android debug

      - name: Hata olursa derleme loglarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: ${{ steps.konum.outputs.dir }}/.buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: sahnebul-apk
          path: ${{ steps.konum.outputs.dir }}/bin/*.apk
